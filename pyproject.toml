[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-input-wrap"
version = "0.1.0"
description = "Clean, decoupled PTY input interceptor and modular plugin architecture for antigravity-cli"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Vikyek", email = "vika.jedr@gmail.com" }
]
keywords = [
    "antigravity-cli",
    "pty",
    "terminal",
    "interceptor",
    "bubbletea",
    "sequencer"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Terminals",
    "Topic :: Utilities"
]

[project.scripts]
agy-input-wrap = "agy_input_wrap.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agy_input_wrap*"]
